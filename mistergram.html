<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#f5f5f7">
    <link rel="icon" href="icon.png" type="image/png">
    <title>mistergramm</title>
    <style>
        :root {
            --ui-scale: 1;
            --bg: #f5f5f7;
            --card: #ffffff;
            --text: #1c1c1e;
            --text2: #8e8e93;
            --accent: #007aff;
            --accent2: #34c759;
            --red: #ff3b30;
            --radius: calc(16px * var(--ui-scale));
            --radius-sm: calc(10px * var(--ui-scale));
            --radius-xs: calc(6px * var(--ui-scale));
            --font-xl: calc(22px * var(--ui-scale));
            --font-l: calc(17px * var(--ui-scale));
            --font-m: calc(15px * var(--ui-scale));
            --font-s: calc(13px * var(--ui-scale));
            --font-xs: calc(11px * var(--ui-scale));
            --pad: calc(16px * var(--ui-scale));
            --pad-sm: calc(10px * var(--ui-scale));
            --pad-xs: calc(6px * var(--ui-scale));
            --header-h: calc(52px * var(--ui-scale));
            --input-h: calc(56px * var(--ui-scale));
            --avatar: calc(44px * var(--ui-scale));
            --bubble-radius: calc(18px * var(--ui-scale));
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            font-size: var(--font-m);
            letter-spacing: -0.01em;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }
        #app {
            height: 100%;
            width: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            transition: transform .32s cubic-bezier(.25, .1, .25, 1), opacity .28s ease;
            will-change: transform, opacity;
            overflow: hidden;
        }
        .screen.hidden-left {
            transform: translateX(-100%);
            opacity: 0;
            pointer-events: none;
        }
        .screen.hidden-right {
            transform: translateX(100%);
            opacity: 0;
            pointer-events: none;
        }
        .screen.hidden-fade {
            opacity: 0;
            pointer-events: none;
            transform: scale(.96);
        }
        .screen.active {
            transform: translateX(0);
            opacity: 1;
            pointer-events: auto;
        }

        .header {
            height: var(--header-h);
            padding-top: var(--safe-top);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: var(--pad);
            padding-right: var(--pad);
            background: rgba(245, 245, 247, .88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: .5px solid rgba(0, 0, 0, .08);
            flex-shrink: 0;
            z-index: 10;
            gap: var(--pad-sm);
        }
        .header-title {
            font-size: var(--font-xl);
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            text-align: center;
        }
        .header-btn {
            width: calc(36px * var(--ui-scale));
            height: calc(36px * var(--ui-scale));
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, .04);
            color: var(--accent);
            font-size: var(--font-l);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background .2s;
            -webkit-tap-highlight-color: transparent;
        }
        .header-btn:active {
            background: rgba(0, 0, 0, .12);
        }
        .header-btn svg {
            width: calc(20px * var(--ui-scale));
            height: calc(20px * var(--ui-scale));
            fill: none;
            stroke: var(--accent);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            padding-bottom: var(--safe-bottom);
            scroll-snap-type: y proximity;
        }
        .content.no-snap {
            scroll-snap-type: none;
        }
        .list-item {
            display: flex;
            align-items: center;
            gap: var(--pad-sm);
            padding: var(--pad-sm) var(--pad);
            cursor: pointer;
            transition: background .15s;
            border-bottom: .5px solid rgba(0, 0, 0, .05);
            scroll-snap-align: start;
            min-height: calc(64px * var(--ui-scale));
        }
        .list-item:active {
            background: rgba(0, 0, 0, .04);
        }
        .avatar {
            width: var(--avatar);
            height: var(--avatar);
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: var(--font-l);
            color: #fff;
            letter-spacing: 0;
            position: relative;
        }
        .avatar .online-dot {
            position: absolute;
            bottom: 1px;
            right: 1px;
            width: calc(12px * var(--ui-scale));
            height: calc(12px * var(--ui-scale));
            border-radius: 50%;
            background: var(--accent2);
            border: 2px solid #fff;
            transition: background .3s;
        }
        .avatar .online-dot.offline {
            background: #c7c7cc;
        }
        .list-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: calc(2px * var(--ui-scale));
        }
        .list-name {
            font-weight: 600;
            font-size: var(--font-m);
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .list-preview {
            font-size: var(--font-s);
            color: var(--text2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .list-time {
            font-size: var(--font-xs);
            color: var(--text2);
            flex-shrink: 0;
        }
        .badge {
            background: var(--accent);
            color: #fff;
            font-size: var(--font-xs);
            font-weight: 600;
            min-width: calc(20px * var(--ui-scale));
            height: calc(20px * var(--ui-scale));
            border-radius: calc(10px * var(--ui-scale));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 calc(6px * var(--ui-scale));
            flex-shrink: 0;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: var(--pad-sm) var(--pad);
            display: flex;
            flex-direction: column;
            gap: calc(4px * var(--ui-scale));
            scroll-behavior: smooth;
        }
        .msg-row {
            display: flex;
            max-width: 82%;
            animation: msgIn .25s ease-out;
        }
        .msg-row.sent {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .msg-row.received {
            align-self: flex-start;
        }
        @keyframes msgIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .bubble {
            padding: calc(10px * var(--ui-scale)) calc(14px * var(--ui-scale));
            border-radius: var(--bubble-radius);
            font-size: var(--font-m);
            line-height: 1.4;
            word-break: break-word;
            position: relative;
            letter-spacing: -0.01em;
        }
        .sent .bubble {
            background: var(--accent);
            color: #fff;
            border-bottom-right-radius: calc(4px * var(--ui-scale));
        }
        .received .bubble {
            background: #e9e9eb;
            color: var(--text);
            border-bottom-left-radius: calc(4px * var(--ui-scale));
        }
        .bubble .msg-time {
            font-size: calc(10px * var(--ui-scale));
            opacity: .65;
            margin-top: calc(3px * var(--ui-scale));
            text-align: right;
        }
        .bubble.file-bubble {
            display: flex;
            align-items: center;
            gap: var(--pad-sm);
            cursor: pointer;
            flex-wrap: wrap;
        }
        .bubble.file-bubble .file-icon {
            font-size: calc(28px * var(--ui-scale));
            flex-shrink: 0;
        }
        .bubble.file-bubble .file-name {
            font-size: var(--font-s);
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 160px;
        }
        .bubble img {
            max-width: 200px;
            max-height: 200px;
            border-radius: var(--radius-xs);
            display: block;
            cursor: pointer;
        }
        .input-bar {
            display: flex;
            align-items: flex-end;
            gap: var(--pad-xs);
            padding: var(--pad-xs) var(--pad);
            padding-bottom: calc(var(--pad-xs) + var(--safe-bottom));
            background: rgba(245, 245, 247, .92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: .5px solid rgba(0, 0, 0, .08);
            flex-shrink: 0;
            z-index: 10;
        }
        .input-bar textarea {
            flex: 1;
            border: none;
            background: #e5e5ea;
            border-radius: calc(20px * var(--ui-scale));
            padding: calc(10px * var(--ui-scale)) calc(14px * var(--ui-scale));
            font-size: var(--font-m);
            font-family: inherit;
            resize: none;
            outline: none;
            max-height: calc(100px * var(--ui-scale));
            line-height: 1.3;
            letter-spacing: -0.01em;
            color: var(--text);
            -webkit-user-select: text;
            user-select: text;
        }
        .input-bar .send-btn {
            width: calc(38px * var(--ui-scale));
            height: calc(38px * var(--ui-scale));
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: #fff;
            font-size: var(--font-l);
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform .2s, opacity .2s;
        }
        .input-bar .send-btn:active {
            transform: scale(.9);
        }
        .input-bar .attach-btn {
            width: calc(38px * var(--ui-scale));
            height: calc(38px * var(--ui-scale));
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--accent);
            font-size: calc(22px * var(--ui-scale));
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        input[type="file"] {
            display: none;
        }

        .setup-form {
            display: flex;
            flex-direction: column;
            gap: var(--pad);
            padding: calc(40px * var(--ui-scale)) var(--pad);
            align-items: center;
            justify-content: center;
            flex: 1;
        }
        .setup-form input {
            width: 100%;
            max-width: 320px;
            border: 1.5px solid #d1d1d6;
            border-radius: var(--radius-sm);
            padding: calc(12px * var(--ui-scale)) calc(14px * var(--ui-scale));
            font-size: var(--font-l);
            font-family: inherit;
            outline: none;
            background: var(--card);
            color: var(--text);
            letter-spacing: -0.01em;
            transition: border-color .2s;
            -webkit-user-select: text;
            user-select: text;
        }
        .setup-form input:focus {
            border-color: var(--accent);
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: calc(13px * var(--ui-scale)) calc(28px * var(--ui-scale));
            font-size: var(--font-l);
            font-weight: 600;
            cursor: pointer;
            letter-spacing: -0.01em;
            transition: opacity .2s;
            width: 100%;
            max-width: 320px;
            text-align: center;
        }
        .btn-primary:active {
            opacity: .75;
        }
        .toast {
            position: fixed;
            top: calc(var(--safe-top) + 60px);
            left: 50%;
            transform: translateX(-50%);
            background: #1c1c1e;
            color: #fff;
            padding: calc(10px * var(--ui-scale)) calc(20px * var(--ui-scale));
            border-radius: 50px;
            font-size: var(--font-s);
            font-weight: 500;
            z-index: 999;
            opacity: 0;
            transition: opacity .3s;
            pointer-events: none;
            letter-spacing: 0;
        }
        .toast.show {
            opacity: 1;
        }
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text2);
            gap: var(--pad-sm);
            padding: var(--pad);
            text-align: center;
        }
        .empty-state .icon-big {
            font-size: calc(48px * var(--ui-scale));
            opacity: .5;
        }
        @media (max-width: 380px) {
            :root {
                --ui-scale: 0.92;
            }
        }
        @media (min-width: 420px) {
            :root {
                --ui-scale: 1.04;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Экран настройки имени -->
        <div id="screen-setup" class="screen active">
            <div class="header"><span class="header-title">Добро пожаловать</span></div>
            <form class="setup-form" id="setup-form">
                <div style="font-size:48px;margin-bottom:8px;">💬</div>
                <input type="text" id="input-displayname" placeholder="Ваше имя" maxlength="30" autocomplete="off" required>
                <button type="submit" class="btn-primary">Продолжить</button>
            </form>
        </div>
        <!-- Экран списка контактов -->
        <div id="screen-list" class="screen hidden-right">
            <div class="header">
                <span class="header-title">Сообщения</span>
                <button class="header-btn" id="btn-refresh" aria-label="Обновить" style="font-size:18px;">⟳</button>
            </div>
            <div class="content" id="contacts-list"></div>
            <div style="padding:var(--pad-xs) var(--pad);padding-bottom:calc(var(--pad-xs)+var(--safe-bottom));text-align:center;font-size:var(--font-xs);color:var(--text2);flex-shrink:0;">
                Ваш ID: <span id="my-id-display" style="font-weight:500;">—</span>
            </div>
        </div>
        <!-- Экран чата -->
        <div id="screen-chat" class="screen hidden-right">
            <div class="header">
                <button class="header-btn" id="btn-back" aria-label="Назад">
                    <svg viewBox="0 0 24 24"><polyline points="15,4 7,12 15,20"/></svg>
                </button>
                <span class="header-title" id="chat-title">Чат</span>
                <span id="chat-status" style="font-size:var(--font-xs);color:var(--accent2);flex-shrink:0;"></span>
            </div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="input-bar">
                <button class="attach-btn" id="btn-attach" aria-label="Прикрепить">📎</button>
                <textarea id="input-message" rows="1" placeholder="Сообщение..." maxlength="5000"></textarea>
                <input type="file" id="file-input" accept="image/*,application/pdf,text/*,.doc,.docx,.zip">
                <button class="send-btn" id="btn-send" aria-label="Отправить">↑</button>
            </div>
        </div>
        <div class="toast" id="toast"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js">
    </script>
    <script>
        (function() {
            // ============ КОНФИГУРАЦИЯ FIREBASE (замени на свою) ============
            const FIREBASE_CONFIG = {
                apiKey: "AIzaSyD-PLACEHOLDER-KEY-REPLACE-ME",
                authDomain: "your-project.firebaseapp.com",
                databaseURL: "https://your-project-default-rtdb.firebaseio.com",
                projectId: "your-project",
                storageBucket: "your-project.appspot.com",
                messagingSenderId: "000000000000",
                appId: "1:000000000000:web:xxxxxxxxxxxxxxxxxxxx"
            };
            const USE_FIREBASE = FIREBASE_CONFIG.apiKey &&
                !FIREBASE_CONFIG.apiKey.includes('PLACEHOLDER') &&
                FIREBASE_CONFIG.databaseURL && !FIREBASE_CONFIG.databaseURL.includes('your-project');

            // ============ DOM-ЭЛЕМЕНТЫ ============
            const $ = (s) => document.querySelector(s);
            const $$ = (s) => document.querySelectorAll(s);
            const screenSetup = $('#screen-setup');
            const screenList = $('#screen-list');
            const screenChat = $('#screen-chat');
            const contactsList = $('#contacts-list');
            const chatMessages = $('#chat-messages');
            const chatTitle = $('#chat-title');
            const chatStatus = $('#chat-status');
            const inputMessage = $('#input-message');
            const inputDisplayname = $('#input-displayname');
            const fileInput = $('#file-input');
            const toast = $('#toast');
            const myIdDisplay = $('#my-id-display');
            const setupForm = $('#setup-form');

            // ============ СОСТОЯНИЕ ============
            let myDeviceId = null;
            let myDisplayName = '';
            let myKeyPair = null; // {publicKey: CryptoKey, privateKey: CryptoKey}
            let myPublicJWK = null;
            let currentChatPeerId = null;
            let currentChatPeerName = '';
            let sharedSecrets = {}; // {peerId: CryptoKey}
            let knownUsers = {}; // {deviceId: {displayName, publicJWK, online, lastSeen}}
            let unreadCounts = {}; // {conversationId: number}
            let allMessagesCache = {}; // {conversationId: [{...}]}
            let firebaseReady = false;
            let db = null;
            let firebaseRefs = {};
            let listenersActive = false;

            // ============ УТИЛИТЫ ============
            function showToast(msg, duration = 2000) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toast._timeout);
                toast._timeout = setTimeout(() => toast.classList.remove('show'), duration);
            }

            function formatTime(ts) {
                const d = new Date(ts);
                const now = new Date();
                const h = d.getHours().toString().padStart(2, '0');
                const m = d.getMinutes().toString().padStart(2, '0');
                if (d.toDateString() === now.toDateString()) return h + ':' + m;
                const day = d.getDate().toString().padStart(2, '0');
                const mon = (d.getMonth() + 1).toString().padStart(2, '0');
                return day + '.' + mon + ' ' + h + ':' + m;
            }

            function getConversationId(a, b) {
                return [a, b].sort().join('::');
            }

            function avatarColor(id) {
                let hash = 0;
                for (let i = 0; i < id.length; i++) hash = ((hash << 5) - hash + id.charCodeAt(i)) | 0;
                const hue = Math.abs(hash) % 360;
                return `hsl(${hue},55%,50%)`;
            }

            function avatarInitials(name) {
                if (!name) return '?';
                const parts = name.trim().split(/\s+/);
                if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
                return name.trim().substring(0, 2).toUpperCase();
            }

            function generateUUID() {
                return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                    const r = Math.random() * 16 | 0;
                    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
                });
            }

            // ============ ШИФРОВАНИЕ ============
            async function generateKeyPair() {
                const pair = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, [
                    'deriveBits'
                ]);
                return pair;
            }

            async function exportPublicJWK(publicKey) {
                return await crypto.subtle.exportKey('jwk', publicKey);
            }

            async function importPublicJWK(jwk) {
                return await crypto.subtle.importKey('jwk', jwk, { name: 'ECDH', namedCurve: 'P-256' }, true, []);
            }

            async function deriveSharedSecret(myPrivateKey, peerPublicKey) {
                const bits = await crypto.subtle.deriveBits({ name: 'ECDH', public: peerPublicKey },
                    myPrivateKey, 256);
                const hash = await crypto.subtle.digest('SHA-256', bits);
                return await crypto.subtle.importKey('raw', hash, { name: 'AES-GCM' }, false, ['encrypt',
                    'decrypt'
                ]);
            }

            async function getSharedSecret(peerId) {
                if (sharedSecrets[peerId]) return sharedSecrets[peerId];
                const peerData = knownUsers[peerId];
                if (!peerData || !peerData.publicJWK) return null;
                const peerPubKey = await importPublicJWK(peerData.publicJWK);
                const secret = await deriveSharedSecret(myKeyPair.privateKey, peerPubKey);
                sharedSecrets[peerId] = secret;
                return secret;
            }

            async function encryptMessage(plaintext, peerId) {
                const secret = await getSharedSecret(peerId);
                if (!secret) throw new Error('No shared secret');
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const encoded = new TextEncoder().encode(plaintext);
                const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, secret, encoded);
                const combined = new Uint8Array(iv.length + ciphertext.byteLength);
                combined.set(iv);
                combined.set(new Uint8Array(ciphertext), iv.length);
                return arrayBufferToBase64(combined.buffer);
            }

            async function decryptMessage(encryptedBase64, peerId) {
                const secret = await getSharedSecret(peerId);
                if (!secret) throw new Error('No shared secret');
                const combined = base64ToArrayBuffer(encryptedBase64);
                const iv = combined.slice(0, 12);
                const ciphertext = combined.slice(12);
                const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, secret, ciphertext);
                return new TextDecoder().decode(decrypted);
            }

            async function encryptFileBase64(base64data, peerId) {
                const secret = await getSharedSecret(peerId);
                if (!secret) throw new Error('No shared secret');
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const encoded = new TextEncoder().encode(base64data);
                const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, secret, encoded);
                const combined = new Uint8Array(iv.length + ciphertext.byteLength);
                combined.set(iv);
                combined.set(new Uint8Array(ciphertext), iv.length);
                return arrayBufferToBase64(combined.buffer);
            }

            async function decryptFileBase64(encryptedBase64, peerId) {
                const secret = await getSharedSecret(peerId);
                if (!secret) throw new Error('No shared secret');
                const combined = base64ToArrayBuffer(encryptedBase64);
                const iv = combined.slice(0, 12);
                const ciphertext = combined.slice(12);
                const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, secret, ciphertext);
                return new TextDecoder().decode(decrypted);
            }

            function arrayBufferToBase64(buffer) {
                let binary = '';
                const bytes = new Uint8Array(buffer);
                for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
                return btoa(binary);
            }

            function base64ToArrayBuffer(base64) {
                const binary = atob(base64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                return bytes;
            }

            // ============ NAVIGATION ============
            function navigateTo(screen) {
                const all = [screenSetup, screenList, screenChat];
                all.forEach(s => {
                    s.classList.remove('active', 'hidden-left', 'hidden-right', 'hidden-fade');
                });
                if (screen === screenSetup) {
                    screenSetup.classList.add('active');
                    screenList.classList.add('hidden-right');
                    screenChat.classList.add('hidden-right');
                } else if (screen === screenList) {
                    screenList.classList.add('active');
                    screenSetup.classList.add('hidden-left');
                    screenChat.classList.add('hidden-right');
                } else if (screen === screenChat) {
                    screenChat.classList.add('active');
                    screenList.classList.add('hidden-left');
                    screenSetup.classList.add('hidden-left');
                }
                adaptLayout();
            }

            // ============ АДАПТИВНЫЙ МАСШТАБ ============
            function adaptLayout() {
                const root = document.documentElement;
                let scale = 1;
                root.style.setProperty('--ui-scale', scale.toString());
                requestAnimationFrame(() => {
                    const activeScreen = document.querySelector('.screen.active');
                    if (!activeScreen) return;
                    const contentEl = activeScreen.querySelector('.content, .chat-messages');
                    const scrollHeight = activeScreen.scrollHeight;
                    const clientHeight = activeScreen.clientHeight;
                    if (scrollHeight > clientHeight + 10) {
                        const ratio = clientHeight / scrollHeight;
                        scale = Math.max(0.85, ratio);
                        root.style.setProperty('--ui-scale', scale.toString());
                    }
                    const newScrollHeight = activeScreen.scrollHeight;
                    const newClientHeight = activeScreen.clientHeight;
                    if (newScrollHeight > newClientHeight + 5 && scale <= 0.86) {
                        if (contentEl) contentEl.style.overflowY = 'auto';
                        if (contentEl) contentEl.classList.add('no-snap');
                    } else {
                        if (contentEl && contentEl.classList.contains('no-snap') && scale > 0.9) {
                            contentEl.classList.remove('no-snap');
                        }
                    }
                });
            }

            // ============ FIREBASE ============
            function initFirebase() {
                if (!USE_FIREBASE) return false;
                try {
                    firebase.initializeApp(FIREBASE_CONFIG);
                    db = firebase.database();
                    firebaseReady = true;
                    return true;
                } catch (e) {
                    console.warn('Firebase init error:', e.message);
                    return false;
                }
            }

            function setupFirebaseListeners() {
                if (!firebaseReady || listenersActive) return;
                listenersActive = true;
                const usersRef = db.ref('users');
                firebaseRefs.users = usersRef;
                usersRef.on('value', snap => {
                    const data = snap.val() || {};
                    knownUsers = {};
                    for (const [id, val] of Object.entries(data)) {
                        knownUsers[id] = {
                            displayName: val.displayName || 'Unknown',
                            publicJWK: val.publicJWK || null,
                            online: val.online || false,
                            lastSeen: val.lastSeen || 0,
                        };
                    }
                    if (myDeviceId && !knownUsers[myDeviceId]) {
                        publishMyPresence();
                    }
                    renderContactsList();
                });
                const msgsRef = db.ref('messages');
                firebaseRefs.messages = msgsRef;
                msgsRef.on('child_added', snap => {
                    const convId = snap.key;
                    const msgsData = snap.val() || {};
                    if (!allMessagesCache[convId]) allMessagesCache[convId] = [];
                    for (const [msgId, msg] of Object.entries(msgsData)) {
                        const exists = allMessagesCache[convId].some(m => m.id === msgId);
                        if (!exists) {
                            allMessagesCache[convId].push({ id: msgId, ...msg });
                        }
                    }
                    allMessagesCache[convId].sort((a, b) => a.timestamp - b.timestamp);
                    if (currentChatPeerId && getConversationId(myDeviceId, currentChatPeerId) === convId) {
                        renderChatMessages();
                    }
                    updateUnreadCounts();
                    renderContactsList();
                });
                msgsRef.on('child_changed', snap => {
                    const convId = snap.key;
                    const msgsData = snap.val() || {};
                    allMessagesCache[convId] = [];
                    for (const [msgId, msg] of Object.entries(msgsData)) {
                        allMessagesCache[convId].push({ id: msgId, ...msg });
                    }
                    allMessagesCache[convId].sort((a, b) => a.timestamp - b.timestamp);
                    if (currentChatPeerId && getConversationId(myDeviceId, currentChatPeerId) === convId) {
                        renderChatMessages();
                    }
                    updateUnreadCounts();
                    renderContactsList();
                });
            }

            async function publishMyPresence() {
                if (!firebaseReady || !myDeviceId) return;
                const userRef = db.ref('users/' + myDeviceId);
                await userRef.set({
                    displayName: myDisplayName,
                    publicJWK: myPublicJWK,
                    online: true,
                    lastSeen: Date.now(),
                });
                userRef.onDisconnect().update({ online: false, lastSeen: Date.now() });
                const connectedRef = db.ref('.info/connected');
                connectedRef.on('value', snap => {
                    if (snap.val() === true) {
                        userRef.update({ online: true, lastSeen: Date.now() });
                    }
                });
            }

            async function sendMessageFirebase(peerId, encryptedData, iv, msgType, fileName, fileSize) {
                if (!firebaseReady) return null;
                const convId = getConversationId(myDeviceId, peerId);
                const msgRef = db.ref('messages/' + convId).push();
                const msg = {
                    from: myDeviceId,
                    to: peerId,
                    encryptedData,
                    timestamp: Date.now(),
                    type: msgType,
                };
                if (msgType === 'file') {
                    msg.fileName = fileName || 'file';
                    msg.fileSize = fileSize || 0;
                }
                await msgRef.set(msg);
                return msgRef.key;
            }

            // ============ LOCAL STORAGE РЕЖИМ ============
            function getLocalStore() {
                try {
                    const d = localStorage.getItem('msg_app_data');
                    return d ? JSON.parse(d) : { users: {}, messages: {} };
                } catch (e) { return { users: {}, messages: {} }; }
            }

            function saveLocalStore(data) {
                try { localStorage.setItem('msg_app_data', JSON.stringify(data)); } catch (e) {}
            }

            function publishLocalPresence() {
                const store = getLocalStore();
                store.users[myDeviceId] = {
                    displayName: myDisplayName,
                    publicJWK: myPublicJWK,
                    online: true,
                    lastSeen: Date.now(),
                };
                saveLocalStore(store);
                knownUsers = { ...store.users };
                knownUsers[myDeviceId].online = true;
                renderContactsList();
            }

            function loadLocalMessages() {
                const store = getLocalStore();
                knownUsers = { ...store.users };
                if (myDeviceId && knownUsers[myDeviceId]) {
                    knownUsers[myDeviceId].online = true;
                }
                allMessagesCache = {};
                for (const [convId, msgs] of Object.entries(store.messages || {})) {
                    allMessagesCache[convId] = Object.entries(msgs).map(([id, m]) => ({ id, ...m }));
                    allMessagesCache[convId].sort((a, b) => a.timestamp - b.timestamp);
                }
                renderContactsList();
                updateUnreadCounts();
            }

            function sendMessageLocal(peerId, encryptedData, msgType, fileName, fileSize) {
                const convId = getConversationId(myDeviceId, peerId);
                const store = getLocalStore();
                if (!store.messages) store.messages = {};
                if (!store.messages[convId]) store.messages[convId] = {};
                const msgId = 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
                const msg = {
                    from: myDeviceId,
                    to: peerId,
                    encryptedData,
                    timestamp: Date.now(),
                    type: msgType,
                };
                if (msgType === 'file') {
                    msg.fileName = fileName || 'file';
                    msg.fileSize = fileSize || 0;
                }
                store.messages[convId][msgId] = msg;
                saveLocalStore(store);
                if (!allMessagesCache[convId]) allMessagesCache[convId] = [];
                allMessagesCache[convId].push({ id: msgId, ...msg });
                allMessagesCache[convId].sort((a, b) => a.timestamp - b.timestamp);
                if (currentChatPeerId && convId === getConversationId(myDeviceId, currentChatPeerId)) {
                    renderChatMessages();
                }
                updateUnreadCounts();
                renderContactsList();
                return msgId;
            }

            // ============ РЕНДЕРИНГ ============
            function renderContactsList() {
                const users = Object.entries(knownUsers).filter(([id]) => id !== myDeviceId);
                users.sort((a, b) => {
                    const aOnline = a[1].online ? 1 : 0;
                    const bOnline = b[1].online ? 1 : 0;
                    if (bOnline !== aOnline) return bOnline - aOnline;
                    const aLast = getLastMessageTime(a[0]);
                    const bLast = getLastMessageTime(b[0]);
                    return bLast - aLast;
                });
                if (users.length === 0) {
                    contactsList.innerHTML =
                        `<div class="empty-state"><div class="icon-big">📭</div><p>Пока никого нет<br>Отправьте ссылку другу</p></div>`;
                } else {
                    contactsList.innerHTML = users.map(([id, u]) => {
                        const convId = getConversationId(myDeviceId, id);
                        const lastMsg = getLastMessage(convId);
                        const preview = lastMsg ? (lastMsg.type === 'file' ? '📎 Файл' :
                            '(зашифровано)') : '';
                        const time = lastMsg ? formatTime(lastMsg.timestamp) : '';
                        const unread = unreadCounts[convId] || 0;
                        return `
                    <div class="list-item" data-peer-id="${id}" data-peer-name="${u.displayName||'Unknown'}">
                      <div class="avatar" style="background:${avatarColor(id)};">
                        ${avatarInitials(u.displayName||'?')}
                        <div class="online-dot${u.online?'':' offline'}"></div>
                      </div>
                      <div class="list-info">
                        <span class="list-name">${escapeHTML(u.displayName||'Unknown')}</span>
                        <span class="list-preview">${escapeHTML(preview)}</span>
                      </div>
                      <span class="list-time">${time}</span>
                      ${unread>0?`<span class="badge">${unread>99?'99+':unread}</span>`:''}
                    </div>`;
                    }).join('');
                }
                if (myDeviceId && knownUsers[myDeviceId]) {
                    const selfConvId = getConversationId(myDeviceId, myDeviceId);
                    const selfUnread = unreadCounts[selfConvId] || 0;
                    const selfLast = getLastMessage(selfConvId);
                    const selfPreview = selfLast ? (selfLast.type === 'file' ? '📎 Файл' : '(заметка)') :
                        'Заметки для себя';
                    const selfTime = selfLast ? formatTime(selfLast.timestamp) : '';
                    const selfHtml = `
                <div class="list-item" data-peer-id="${myDeviceId}" data-peer-name="Я (Заметки)" style="border-top:2px solid rgba(0,0,0,.06);">
                  <div class="avatar" style="background:${avatarColor(myDeviceId)};">${avatarInitials(myDisplayName)}</div>
                  <div class="list-info">
                    <span class="list-name">📝 Я (Заметки)</span>
                    <span class="list-preview">${escapeHTML(selfPreview)}</span>
                  </div>
                  <span class="list-time">${selfTime}</span>
                  ${selfUnread>0?`<span class="badge">${selfUnread>99?'99+':selfUnread}</span>`:''}
                </div>`;
                    contactsList.insertAdjacentHTML('beforeend', selfHtml);
                }
                bindContactClicks();
                adaptLayout();
            }

            function getLastMessage(convId) {
                const msgs = allMessagesCache[convId];
                if (!msgs || msgs.length === 0) return null;
                return msgs[msgs.length - 1];
            }

            function getLastMessageTime(peerId) {
                const convId = getConversationId(myDeviceId, peerId);
                const last = getLastMessage(convId);
                return last ? last.timestamp : (knownUsers[peerId]?.lastSeen || 0);
            }

            function updateUnreadCounts() {
                unreadCounts = {};
                for (const [convId, msgs] of Object.entries(allMessagesCache)) {
                    const parts = convId.split('::');
                    if (!parts.includes(myDeviceId)) continue;
                    const peerId = parts[0] === myDeviceId ? parts[1] : parts[0];
                    let count = 0;
                    for (const msg of msgs) {
                        if (msg.to === myDeviceId && msg.from !== myDeviceId && !msg.read) {
                            count++;
                        }
                    }
                    if (count > 0) unreadCounts[convId] = count;
                }
            }

            function bindContactClicks() {
                contactsList.querySelectorAll('.list-item').forEach(item => {
                    item.addEventListener('click', function() {
                        const peerId = this.dataset.peerId;
                        const peerName = this.dataset.peerName;
                        openChat(peerId, peerName);
                    });
                });
            }

            function openChat(peerId, peerName) {
                currentChatPeerId = peerId;
                currentChatPeerName = peerName;
                chatTitle.textContent = peerName || 'Чат';
                const peerData = knownUsers[peerId];
                if (peerData && peerData.online) {
                    chatStatus.textContent = '● онлайн';
                    chatStatus.style.color = 'var(--accent2)';
                } else if (peerData) {
                    chatStatus.textContent = 'был(а) ' + formatTime(peerData.lastSeen || Date.now());
                    chatStatus.style.color = 'var(--text2)';
                } else {
                    chatStatus.textContent = '';
                }
                if (peerId === myDeviceId) {
                    chatStatus.textContent = 'только вы';
                    chatStatus.style.color = 'var(--text2)';
                }
                renderChatMessages();
                navigateTo(screenChat);
                setTimeout(() => {
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                    adaptLayout();
                }, 350);
                const convId = getConversationId(myDeviceId, peerId);
                if (unreadCounts[convId]) {
                    unreadCounts[convId] = 0;
                    renderContactsList();
                }
            }

            async function renderChatMessages() {
                if (!currentChatPeerId) return;
                const convId = getConversationId(myDeviceId, currentChatPeerId);
                const msgs = allMessagesCache[convId] || [];
                if (msgs.length === 0) {
                    chatMessages.innerHTML =
                        '<div class="empty-state"><p>Нет сообщений</p><p style="font-size:var(--font-xs);">Напишите первым ✨</p></div>';
                } else {
                    const fragments = [];
                    for (const msg of msgs) {
                        const isSent = msg.from === myDeviceId;
                        let displayContent = '';
                        let isFile = msg.type === 'file';
                        try {
                            if (isFile) {
                                displayContent =
                                    `<div class="file-bubble" data-encrypted="${escapeHTML(msg.encryptedData)}"><span class="file-icon">📄</span><span class="file-name">${escapeHTML(msg.fileName||'файл')}</span><span style="font-size:var(--font-xs);opacity:.6;">${formatFileSize(msg.fileSize||0)}</span></div>`;
                            } else {
                                const decrypted = await decryptMessage(msg.encryptedData, isSent ? msg
                                    .to : msg.from).catch(() => '(ошибка расшифровки)');
                                displayContent = escapeHTML(decrypted);
                            }
                        } catch (e) {
                            displayContent = '🔒 (не удалось расшифровать)';
                        }
                        fragments.push(`
                  <div class="msg-row ${isSent?'sent':'received'}">
                    <div class="bubble${isFile?' file-bubble':''}" data-msg-id="${msg.id}">
                      ${displayContent}
                      <div class="msg-time">${formatTime(msg.timestamp)}${isSent?' · ✓':''}</div>
                    </div>
                  </div>`);
                    }
                    chatMessages.innerHTML = fragments.join('');
                }
                bindFileBubbleClicks();
                requestAnimationFrame(() => {
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                    adaptLayout();
                });
            }

            function bindFileBubbleClicks() {
                chatMessages.querySelectorAll('.file-bubble[data-encrypted]').forEach(bubble => {
                    bubble.addEventListener('click', async function(e) {
                        e.stopPropagation();
                        const encryptedData = this.dataset.encrypted;
                        const peerId = currentChatPeerId;
                        try {
                            const base64 = await decryptFileBase64(encryptedData, peerId);
                            const byteString = atob(base64);
                            const mimeMatch = base64.match(/^data:([^;]+);base64,/);
                            const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
                            const ab = new Uint8Array(byteString.length);
                            for (let i = 0; i < byteString.length; i++) ab[i] = byteString.charCodeAt(i);
                            const blob = new Blob([ab], { type: mime });
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = this.querySelector('.file-name')?.textContent || 'file';
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                            URL.revokeObjectURL(url);
                            showToast('Файл скачан');
                        } catch (err) {
                            showToast('Ошибка расшифровки файла');
                            console.error(err);
                        }
                    });
                });
            }

            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str || '';
                return div.innerHTML;
            }

            function formatFileSize(bytes) {
                if (!bytes || bytes === 0) return '0 B';
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / 1048576).toFixed(1) + ' MB';
            }

            // ============ ОТПРАВКА СООБЩЕНИЙ ============
            async function sendMessage() {
                const text = inputMessage.value.trim();
                const file = fileInput.files[0];
                if (!text && !file) return;
                if (!currentChatPeerId) return;
                const peerId = currentChatPeerId;
                if (peerId !== myDeviceId) {
                    const peerData = knownUsers[peerId];
                    if (!peerData || !peerData.publicJWK) {
                        showToast('⏳ Ожидание ключа собеседника...');
                        return;
                    }
                    const secret = await getSharedSecret(peerId);
                    if (!secret) {
                        showToast('🔐 Не удалось установить безопасное соединение');
                        return;
                    }
                }
                try {
                    if (file) {
                        const base64 = await readFileAsBase64(file);
                        const encrypted = peerId === myDeviceId ?
                            await encryptFileBase64(base64, myDeviceId) :
                            await encryptFileBase64(base64, peerId);
                        const msgData = {
                            encryptedData: encrypted,
                            type: 'file',
                            fileName: file.name,
                            fileSize: file.size,
                        };
                        if (firebaseReady) {
                            await sendMessageFirebase(peerId, encrypted, '', 'file', file.name, file.size);
                        } else {
                            sendMessageLocal(peerId, encrypted, 'file', file.name, file.size);
                        }
                        fileInput.value = '';
                    }
                    if (text) {
                        const encrypted = peerId === myDeviceId ?
                            await encryptMessage(text, myDeviceId) :
                            await encryptMessage(text, peerId);
                        if (firebaseReady) {
                            await sendMessageFirebase(peerId, encrypted, '', 'text', '', 0);
                        } else {
                            sendMessageLocal(peerId, encrypted, 'text', '', 0);
                        }
                        inputMessage.value = '';
                        inputMessage.style.height = 'auto';
                    }
                    if (currentChatPeerId === peerId) {
                        await renderChatMessages();
                        setTimeout(() => { chatMessages.scrollTop = chatMessages.scrollHeight; }, 100);
                    }
                    updateUnreadCounts();
                    renderContactsList();
                    playSendSound();
                } catch (e) {
                    console.error('Send error:', e);
                    showToast('Ошибка отправки');
                }
            }

            function readFileAsBase64(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            }

            function playSendSound() {
                try {
                    const ctx = new(window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1800, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.12);
                } catch (e) {}
            }

            // ============ ИНИЦИАЛИЗАЦИЯ ============
            async function initialize() {
                myDeviceId = localStorage.getItem('msg_device_id');
                if (!myDeviceId) {
                    myDeviceId = generateUUID();
                    localStorage.setItem('msg_device_id', myDeviceId);
                }
                myDisplayName = localStorage.getItem('msg_display_name') || '';
                const storedJWK = localStorage.getItem('msg_public_jwk');
                const storedPrivateJWK = localStorage.getItem('msg_private_jwk');
                if (storedJWK && storedPrivateJWK) {
                    try {
                        myPublicJWK = JSON.parse(storedJWK);
                        const privateJWK = JSON.parse(storedPrivateJWK);
                        myKeyPair = {
                            publicKey: await crypto.subtle.importKey('jwk', myPublicJWK, { name: 'ECDH',
                                namedCurve: 'P-256' }, true, []),
                            privateKey: await crypto.subtle.importKey('jwk', privateJWK, { name: 'ECDH',
                                namedCurve: 'P-256' }, true, ['deriveBits']),
                        };
                    } catch (e) {
                        myKeyPair = null;
                        myPublicJWK = null;
                    }
                }
                if (!myKeyPair) {
                    myKeyPair = await generateKeyPair();
                    myPublicJWK = await exportPublicJWK(myKeyPair.publicKey);
                    const privateJWK = await crypto.subtle.exportKey('jwk', myKeyPair.privateKey);
                    localStorage.setItem('msg_public_jwk', JSON.stringify(myPublicJWK));
                    localStorage.setItem('msg_private_jwk', JSON.stringify(privateJWK));
                }
                myIdDisplay.textContent = myDeviceId.substring(0, 8) + '...';
                if (myDisplayName) {
                    inputDisplayname.value = myDisplayName;
                    screenSetup.classList.add('hidden-fade');
                    screenSetup.classList.remove('active');
                    screenList.classList.add('active');
                    screenList.classList.remove('hidden-right');
                }
                if (initFirebase()) {
                    setupFirebaseListeners();
                    await publishMyPresence();
                } else {
                    publishLocalPresence();
                    loadLocalMessages();
                }
                if (!myDisplayName) {
                    navigateTo(screenSetup);
                } else {
                    navigateTo(screenList);
                }
                requestPermissions();
                adaptLayout();
            }

            async function requestPermissions() {
                if ('Notification' in window && Notification.permission === 'default') {
                    try { await Notification.requestPermission(); } catch (e) {}
                }
                if ('vibrate' in navigator) {
                    try { navigator.vibrate(1); } catch (e) {}
                }
            }

            // ============ ОБРАБОТЧИКИ СОБЫТИЙ ============
            setupForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                const name = inputDisplayname.value.trim();
                if (!name) return;
                if (name.length < 2) { showToast('Имя слишком короткое'); return; }
                myDisplayName = name;
                localStorage.setItem('msg_display_name', myDisplayName);
                if (firebaseReady) {
                    await publishMyPresence();
                    setupFirebaseListeners();
                } else {
                    publishLocalPresence();
                    loadLocalMessages();
                }
                navigateTo(screenList);
                showToast('👋 Привет, ' + myDisplayName + '!');
                adaptLayout();
            });

            $('#btn-back').addEventListener('click', () => {
                currentChatPeerId = null;
                currentChatPeerName = '';
                navigateTo(screenList);
                updateUnreadCounts();
                renderContactsList();
                adaptLayout();
            });

            $('#btn-refresh').addEventListener('click', () => {
                if (firebaseReady && firebaseRefs.users) {
                    firebaseRefs.users.once('value').then(snap => {
                        const data = snap.val() || {};
                        knownUsers = {};
                        for (const [id, val] of Object.entries(data)) {
                            knownUsers[id] = {
                                displayName: val.displayName || 'Unknown',
                                publicJWK: val.publicJWK || null,
                                online: val.online || false,
                                lastSeen: val.lastSeen || 0,
                            };
                        }
                        renderContactsList();
                        showToast('Обновлено');
                    });
                } else {
                    loadLocalMessages();
                    showToast('Обновлено (локально)');
                }
            });

            $('#btn-send').addEventListener('click', sendMessage);
            inputMessage.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            inputMessage.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, parseFloat(getComputedStyle(document
                    .documentElement).getPropertyValue('--ui-scale')) * 100) + 'px';
                adaptLayout();
            });

            $('#btn-attach').addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', function() {
                if (this.files[0]) {
                    const maxSize = 2 * 1024 * 1024;
                    if (this.files[0].size > maxSize) {
                        showToast('Файл слишком большой (макс 2 МБ)');
                        this.value = '';
                        return;
                    }
                    sendMessage();
                }
            });

            window.addEventListener('resize', () => {
                requestAnimationFrame(adaptLayout);
            });
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', () => {
                    requestAnimationFrame(adaptLayout);
                });
                window.visualViewport.addEventListener('scroll', () => {
                    requestAnimationFrame(adaptLayout);
                });
            }
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    if (firebaseReady && myDeviceId) {
                        db.ref('users/' + myDeviceId).update({ online: true, lastSeen: Date.now() });
                    } else if (myDeviceId) {
                        publishLocalPresence();
                    }
                    adaptLayout();
                }
            });
            window.addEventListener('beforeunload', () => {
                if (firebaseReady && myDeviceId) {
                    db.ref('users/' + myDeviceId).update({ online: false, lastSeen: Date.now() });
                }
            });

            // ============ ЗАПУСК ============
            initialize().catch(err => {
                console.error('Init error:', err);
                showToast('Ошибка инициализации. Обновите страницу.');
            });

            // Экспорт для отладки
            window.__msgApp = {
                myDeviceId,
                knownUsers,
                allMessagesCache,
                unreadCounts,
                firebaseReady,
                navigateTo,
                openChat,
                sendMessage,
                adaptLayout,
                renderContactsList,
                renderChatMessages,
            };
        })();
    </script>
</body>
</html>
