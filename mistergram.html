<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="icon" href="icon.png" type="image/png">
  <title>SecureChat</title>
  <style>
    :root {
      --ui-scale: 1;
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1c1c1e;
      --text2: #8e8e93;
      --accent: #007aff;
      --accent2: #34c759;
      --red: #ff3b30;
      --radius: calc(16px * var(--ui-scale));
      --radius-sm: calc(10px * var(--ui-scale));
      --radius-xs: calc(6px * var(--ui-scale));
      --font-xl: calc(22px * var(--ui-scale));
      --font-l: calc(17px * var(--ui-scale));
      --font-m: calc(15px * var(--ui-scale));
      --font-s: calc(13px * var(--ui-scale));
      --font-xs: calc(11px * var(--ui-scale));
      --pad: calc(16px * var(--ui-scale));
      --pad-sm: calc(10px * var(--ui-scale));
      --pad-xs: calc(6px * var(--ui-scale));
      --header-h: calc(52px * var(--ui-scale));
      --input-h: calc(56px * var(--ui-scale));
      --avatar: calc(44px * var(--ui-scale));
      --bubble-radius: calc(18px * var(--ui-scale));
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
    html,body { height:100%; width:100%; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; font-size:var(--font-m); letter-spacing:-0.01em; position:fixed; top:0; left:0; right:0; bottom:0; }
    #app { height:100%; width:100%; position:relative; overflow:hidden; display:flex; flex-direction:column; }
    .screen { position:absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; background:var(--bg); transition:transform .32s cubic-bezier(.25,.1,.25,1),opacity .28s ease; will-change:transform,opacity; overflow:hidden; }
    .screen.hidden-left { transform:translateX(-100%); opacity:0; pointer-events:none; }
    .screen.hidden-right { transform:translateX(100%); opacity:0; pointer-events:none; }
    .screen.hidden-fade { opacity:0; pointer-events:none; transform:scale(.96); }
    .screen.active { transform:translateX(0); opacity:1; pointer-events:auto; }
    .header { height:var(--header-h); padding-top:var(--safe-top); display:flex; align-items:center; justify-content:space-between; padding-left:var(--pad); padding-right:var(--pad); background:rgba(245,245,247,.88); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-bottom:.5px solid rgba(0,0,0,.08); flex-shrink:0; z-index:10; gap:var(--pad-sm); }
    .header-title { font-size:var(--font-xl); font-weight:700; letter-spacing:-0.02em; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; text-align:center; }
    .header-btn { width:calc(36px*var(--ui-scale)); height:calc(36px*var(--ui-scale)); border-radius:50%; border:none; background:rgba(0,0,0,.04); color:var(--accent); font-size:var(--font-l); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .2s; }
    .header-btn:active { background:rgba(0,0,0,.12); }
    .header-btn svg { width:calc(20px*var(--ui-scale)); height:calc(20px*var(--ui-scale)); fill:none; stroke:var(--accent); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .content { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:var(--safe-bottom); }
    .list-item { display:flex; align-items:center; gap:var(--pad-sm); padding:var(--pad-sm) var(--pad); cursor:pointer; border-bottom:.5px solid rgba(0,0,0,.05); min-height:calc(64px*var(--ui-scale)); }
    .list-item:active { background:rgba(0,0,0,.04); }
    .avatar { width:var(--avatar); height:var(--avatar); border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:var(--font-l); color:#fff; position:relative; }
    .online-dot { position:absolute; bottom:1px; right:1px; width:calc(12px*var(--ui-scale)); height:calc(12px*var(--ui-scale)); border-radius:50%; background:var(--accent2); border:2px solid #fff; }
    .online-dot.offline { background:#c7c7cc; }
    .list-info { flex:1; min-width:0; display:flex; flex-direction:column; gap:calc(2px*var(--ui-scale)); }
    .list-name { font-weight:600; font-size:var(--font-m); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .list-preview { font-size:var(--font-s); color:var(--text2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .badge { background:var(--accent); color:#fff; font-size:var(--font-xs); font-weight:600; min-width:calc(20px*var(--ui-scale)); height:calc(20px*var(--ui-scale)); border-radius:calc(10px*var(--ui-scale)); display:flex; align-items:center; justify-content:center; padding:0 calc(6px*var(--ui-scale)); flex-shrink:0; }
    .chat-messages { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:var(--pad-sm) var(--pad); display:flex; flex-direction:column; gap:calc(4px*var(--ui-scale)); }
    .msg-row { display:flex; max-width:82%; animation:msgIn .25s ease-out; }
    .msg-row.sent { align-self:flex-end; flex-direction:row-reverse; }
    .msg-row.received { align-self:flex-start; }
    @keyframes msgIn { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
    .bubble { padding:calc(10px*var(--ui-scale)) calc(14px*var(--ui-scale)); border-radius:var(--bubble-radius); font-size:var(--font-m); line-height:1.4; word-break:break-word; }
    .sent .bubble { background:var(--accent); color:#fff; border-bottom-right-radius:calc(4px*var(--ui-scale)); }
    .received .bubble { background:#e9e9eb; color:var(--text); border-bottom-left-radius:calc(4px*var(--ui-scale)); }
    .bubble .msg-time { font-size:calc(10px*var(--ui-scale)); opacity:.65; margin-top:calc(3px*var(--ui-scale)); text-align:right; }
    .file-bubble { cursor:pointer; display:flex; align-items:center; gap:var(--pad-sm); }
    .file-bubble .file-icon { font-size:calc(28px*var(--ui-scale)); }
    .input-bar { display:flex; align-items:flex-end; gap:var(--pad-xs); padding:var(--pad-xs) var(--pad); padding-bottom:calc(var(--pad-xs)+var(--safe-bottom)); background:rgba(245,245,247,.92); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-top:.5px solid rgba(0,0,0,.08); flex-shrink:0; z-index:10; }
    .input-bar textarea { flex:1; border:none; background:#e5e5ea; border-radius:calc(20px*var(--ui-scale)); padding:calc(10px*var(--ui-scale)) calc(14px*var(--ui-scale)); font-size:var(--font-m); font-family:inherit; resize:none; outline:none; max-height:calc(100px*var(--ui-scale)); line-height:1.3; color:var(--text); -webkit-user-select:text; user-select:text; }
    .input-bar .send-btn { width:calc(38px*var(--ui-scale)); height:calc(38px*var(--ui-scale)); border-radius:50%; border:none; background:var(--accent); color:#fff; font-size:var(--font-l); cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
    .input-bar .attach-btn { width:calc(38px*var(--ui-scale)); height:calc(38px*var(--ui-scale)); border-radius:50%; border:none; background:transparent; color:var(--accent); font-size:calc(22px*var(--ui-scale)); cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
    input[type="file"] { display:none; }
    .setup-form { display:flex; flex-direction:column; gap:var(--pad); padding:calc(40px*var(--ui-scale)) var(--pad); align-items:center; justify-content:center; flex:1; }
    .setup-form input { width:100%; max-width:320px; border:1.5px solid #d1d1d6; border-radius:var(--radius-sm); padding:calc(12px*var(--ui-scale)) calc(14px*var(--ui-scale)); font-size:var(--font-l); font-family:inherit; outline:none; background:var(--card); color:var(--text); -webkit-user-select:text; user-select:text; }
    .btn-primary { background:var(--accent); color:#fff; border:none; border-radius:50px; padding:calc(13px*var(--ui-scale)) calc(28px*var(--ui-scale)); font-size:var(--font-l); font-weight:600; cursor:pointer; width:100%; max-width:320px; text-align:center; }
    .toast { position:fixed; top:calc(var(--safe-top) + 60px); left:50%; transform:translateX(-50%); background:#1c1c1e; color:#fff; padding:calc(10px*var(--ui-scale)) calc(20px*var(--ui-scale)); border-radius:50px; font-size:var(--font-s); z-index:999; opacity:0; transition:opacity .3s; pointer-events:none; }
    .toast.show { opacity:1; }
    .empty-state { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--text2); gap:var(--pad-sm); padding:var(--pad); text-align:center; }
    @media (max-width:380px) { :root { --ui-scale:0.92; } }
    @media (min-width:420px) { :root { --ui-scale:1.04; } }
  </style>
</head>
<body>
  <div id="app">
    <div id="screen-setup" class="screen active">
      <div class="header"><span class="header-title">Добро пожаловать</span></div>
      <form class="setup-form" id="setup-form">
        <div style="font-size:48px;">💬</div>
        <input type="text" id="input-displayname" placeholder="Ваше имя" maxlength="30" autocomplete="off" required>
        <button type="submit" class="btn-primary">Продолжить</button>
      </form>
    </div>
    <div id="screen-list" class="screen hidden-right">
      <div class="header">
        <span class="header-title">Контакты</span>
        <button class="header-btn" id="btn-add-friend" title="Добавить друга">＋</button>
      </div>
      <div class="content" id="contacts-list"></div>
      <div style="padding:var(--pad-xs) var(--pad);padding-bottom:calc(var(--pad-xs)+var(--safe-bottom));font-size:var(--font-xs);color:var(--text2);text-align:center;">
        Ваш ID: <span id="my-peer-id" style="font-weight:500;">—</span>
      </div>
    </div>
    <div id="screen-chat" class="screen hidden-right">
      <div class="header">
        <button class="header-btn" id="btn-back"><svg viewBox="0 0 24 24"><polyline points="15,4 7,12 15,20"/></svg></button>
        <span class="header-title" id="chat-title">Чат</span>
        <span id="chat-status" style="font-size:var(--font-xs);color:var(--accent2);"></span>
      </div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="input-bar">
        <button class="attach-btn" id="btn-attach">📎</button>
        <textarea id="input-message" rows="1" placeholder="Сообщение..." maxlength="5000"></textarea>
        <input type="file" id="file-input">
        <button class="send-btn" id="btn-send">↑</button>
      </div>
    </div>
    <div class="toast" id="toast"></div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gun@0.2020.1239/gun.min.js"></script>
  <script>
    (function() {
      const $ = s => document.querySelector(s);
      const screenSetup = $('#screen-setup');
      const screenList = $('#screen-list');
      const screenChat = $('#screen-chat');
      const contactsList = $('#contacts-list');
      const chatMessages = $('#chat-messages');
      const chatTitle = $('#chat-title');
      const chatStatus = $('#chat-status');
      const inputMessage = $('#input-message');
      const inputDisplayname = $('#input-displayname');
      const fileInput = $('#file-input');
      const toast = $('#toast');
      const myPeerIdSpan = $('#my-peer-id');

      let myDeviceId = localStorage.getItem('securechat_deviceid') || crypto.randomUUID();
      localStorage.setItem('securechat_deviceid', myDeviceId);
      let myDisplayName = localStorage.getItem('securechat_displayname') || '';
      let myKeyPair = null;
      let myPublicJWK = null;
      let gun, gunUsers;
      let peer, peerId;
      let activeConnections = {};
      let pendingMessages = {};
      let knownPeers = {};
      let currentChatPeerId = null;
      let currentChatPeerName = '';
      let messageCache = {};

      const DB_NAME = 'SecureChatDB';
      const DB_VERSION = 1;
      let db;

      function openDB() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, DB_VERSION);
          request.onupgradeneeded = e => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('messages')) {
              const store = db.createObjectStore('messages', { keyPath: 'id' });
              store.createIndex('conversation', 'conversationId', { unique: false });
              store.createIndex('timestamp', 'timestamp', { unique: false });
            }
            if (!db.objectStoreNames.contains('files')) {
              db.createObjectStore('files', { keyPath: 'id' });
            }
          };
          request.onsuccess = e => resolve(e.target.result);
          request.onerror = e => reject(e.target.error);
        });
      }

      function dbAddMessage(msg) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction('messages', 'readwrite');
          tx.objectStore('messages').put(msg);
          tx.oncomplete = () => resolve();
          tx.onerror = e => reject(e.target.error);
        });
      }
      function dbGetMessages(conversationId) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction('messages', 'readonly');
          const store = tx.objectStore('messages');
          const index = store.index('conversation');
          const range = IDBKeyRange.only(conversationId);
          const req = index.openCursor(range, 'next');
          const msgs = [];
          req.onsuccess = e => {
            const cursor = e.target.result;
            if (cursor) { msgs.push(cursor.value); cursor.continue(); } else resolve(msgs.sort((a,b)=>a.timestamp-b.timestamp));
          };
          req.onerror = e => reject(e.target.error);
        });
      }
      function dbStoreFile(id, blob) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction('files', 'readwrite');
          tx.objectStore('files').put({ id, blob });
          tx.oncomplete = () => resolve();
          tx.onerror = e => reject(e.target.error);
        });
      }
      function dbGetFile(id) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction('files', 'readonly');
          const req = tx.objectStore('files').get(id);
          req.onsuccess = e => resolve(e.target.result?.blob);
          req.onerror = e => reject(e.target.error);
        });
      }

      function showToast(msg, dur=2000) {
        toast.textContent = msg; toast.classList.add('show');
        clearTimeout(toast._t); toast._t = setTimeout(()=>toast.classList.remove('show'), dur);
      }
      function formatTime(ts) { const d=new Date(ts); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); }
      function getConversationId(a,b) { return [a,b].sort().join('::'); }
      function avatarColor(id) { let h=0; for(let i=0;i<id.length;i++) h=((h<<5)-h+id.charCodeAt(i))|0; return `hsl(${Math.abs(h)%360},55%,50%)`; }
      function avatarInitials(name) { if(!name) return '?'; const p=name.trim().split(/\s+/); return p.length>=2?(p[0][0]+p[1][0]).toUpperCase():name.substring(0,2).toUpperCase(); }
      function escapeHTML(s) { const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
      function arrayBufferToBase64(buf) { let b=''; const u=new Uint8Array(buf); for(let i=0;i<u.length;i++) b+=String.fromCharCode(u[i]); return btoa(b); }
      function base64ToArrayBuffer(b64) { const b=atob(b64); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u.buffer; }

      async function generateKeyPair() {
        return await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'}, true, ['deriveBits']);
      }
      async function exportJWK(key) { return await crypto.subtle.exportKey('jwk', key); }
      async function importPublicJWK(jwk) { return await crypto.subtle.importKey('jwk', jwk, {name:'ECDH',namedCurve:'P-256'}, true, []); }
      async function deriveSecret(priv, pub) {
        const bits = await crypto.subtle.deriveBits({name:'ECDH',public:pub}, priv, 256);
        const hash = await crypto.subtle.digest('SHA-256', bits);
        return await crypto.subtle.importKey('raw', hash, {name:'AES-GCM'}, false, ['encrypt','decrypt']);
      }
      async function getSharedSecret(peerId) {
        const peerData = knownPeers[peerId];
        if(!peerData?.publicJWK) throw new Error('No public key');
        const pub = await importPublicJWK(peerData.publicJWK);
        return await deriveSecret(myKeyPair.privateKey, pub);
      }
      async function encryptData(plaintext, peerId) {
        const secret = await getSharedSecret(peerId);
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const encoded = new TextEncoder().encode(plaintext);
        const ct = await crypto.subtle.encrypt({name:'AES-GCM',iv}, secret, encoded);
        const combined = new Uint8Array(iv.length+ct.byteLength);
        combined.set(iv); combined.set(new Uint8Array(ct), iv.length);
        return arrayBufferToBase64(combined.buffer);
      }
      async function decryptData(encB64, peerId) {
        const secret = await getSharedSecret(peerId);
        const combined = new Uint8Array(base64ToArrayBuffer(encB64));
        const iv = combined.slice(0,12);
        const ct = combined.slice(12);
        const dec = await crypto.subtle.decrypt({name:'AES-GCM',iv}, secret, ct);
        return new TextDecoder().decode(dec);
      }
      async function encryptFileBuffer(arrayBuffer, peerId) {
        const secret = await getSharedSecret(peerId);
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const ct = await crypto.subtle.encrypt({name:'AES-GCM',iv}, secret, arrayBuffer);
        const combined = new Uint8Array(iv.length+ct.byteLength);
        combined.set(iv); combined.set(new Uint8Array(ct), iv.length);
        return combined.buffer;
      }
      async function decryptFileBuffer(encBuf, peerId) {
        const secret = await getSharedSecret(peerId);
        const combined = new Uint8Array(encBuf);
        const iv = combined.slice(0,12);
        const ct = combined.slice(12);
        return await crypto.subtle.decrypt({name:'AES-GCM',iv}, secret, ct);
      }

      function navigateTo(screen) {
        [screenSetup,screenList,screenChat].forEach(s=>s.classList.remove('active','hidden-left','hidden-right','hidden-fade'));
        if(screen===screenSetup) { screenSetup.classList.add('active'); screenList.classList.add('hidden-right'); screenChat.classList.add('hidden-right'); }
        else if(screen===screenList) { screenList.classList.add('active'); screenSetup.classList.add('hidden-left'); screenChat.classList.add('hidden-right'); }
        else { screenChat.classList.add('active'); screenList.classList.add('hidden-left'); screenSetup.classList.add('hidden-left'); }
        adaptLayout();
      }

      function adaptLayout() {
        const root=document.documentElement; let scale=1; root.style.setProperty('--ui-scale','1');
        requestAnimationFrame(()=>{
          const active=document.querySelector('.screen.active'); if(!active) return;
          const sh=active.scrollHeight, ch=active.clientHeight;
          if(sh>ch+10) { scale=Math.max(0.85, ch/sh); root.style.setProperty('--ui-scale',scale.toString()); }
        });
      }

      async function loadOrCreateKeys() {
        let pubJwk = localStorage.getItem('securechat_pubJWK');
        let privJwk = localStorage.getItem('securechat_privJWK');
        if(pubJwk && privJwk) {
          myPublicJWK = JSON.parse(pubJwk);
          const priv = await crypto.subtle.importKey('jwk', JSON.parse(privJwk), {name:'ECDH',namedCurve:'P-256'}, true, ['deriveBits']);
          const pub = await crypto.subtle.importKey('jwk', myPublicJWK, {name:'ECDH',namedCurve:'P-256'}, true, []);
          myKeyPair = { publicKey: pub, privateKey: priv };
        } else {
          myKeyPair = await generateKeyPair();
          myPublicJWK = await exportJWK(myKeyPair.publicKey);
          const privJwk = await exportJWK(myKeyPair.privateKey);
          localStorage.setItem('securechat_pubJWK', JSON.stringify(myPublicJWK));
          localStorage.setItem('securechat_privJWK', JSON.stringify(privJwk));
        }
      }

      function initGun() {
        gun = Gun({ peers: ['https://gun-manhattan.herokuapp.com/gun','https://gun-us.herokuapp.com/gun'] });
        gunUsers = gun.get('securechat_users_v2');
        gunUsers.map().on((data, id) => {
          if(!data || !id) return;
          if(id === myDeviceId) return;
          knownPeers[id] = { displayName: data.displayName, publicJWK: data.publicJWK, peerId: data.peerId, online: data.online, lastSeen: data.lastSeen };
          renderContactsList();
        });
      }

      function updateMyGunProfile() {
        if(!gunUsers) return;
        gunUsers.get(myDeviceId).put({
          displayName: myDisplayName,
          publicJWK: myPublicJWK,
          peerId: peerId,
          online: true,
          lastSeen: Date.now()
        });
      }

      async function initPeer() {
        peerId = myDeviceId;
        peer = new Peer(peerId, { debug: 0 });
        peer.on('open', id => {
          myPeerIdSpan.textContent = id.substring(0,8)+'...';
          updateMyGunProfile();
        });
        peer.on('connection', conn => {
          setupConnection(conn);
        });
        peer.on('disconnected', () => {
          peer.reconnect();
        });
        peer.on('error', err => console.warn('Peer error', err));
        window.addEventListener('beforeunload', () => {
          if(gunUsers) gunUsers.get(myDeviceId).put({ online: false, lastSeen: Date.now() });
        });
      }

      function setupConnection(conn) {
        const peerIdFrom = conn.peer;
        activeConnections[peerIdFrom] = conn;
        conn.on('data', async data => {
          if(typeof data === 'string') {
            try {
              const msg = JSON.parse(data);
              if(msg.type === 'text' || msg.type === 'file') {
                await handleIncomingMessage(msg, peerIdFrom);
              } else if(msg.type === 'ping') {
                conn.send(JSON.stringify({type:'pong'}));
              }
            } catch(e) {}
          } else if(data instanceof ArrayBuffer) {
            // handle binary file if sent separately (not used in this version)
          }
        });
        conn.on('close', () => {
          delete activeConnections[peerIdFrom];
        });
        conn.on('error', () => {});
        sendPendingMessages(peerIdFrom);
      }

      async function connectToPeer(remotePeerId) {
        if(activeConnections[remotePeerId]) return activeConnections[remotePeerId];
        if(!peer) return null;
        const conn = peer.connect(remotePeerId, { reliable: true });
        return new Promise((resolve, reject) => {
          conn.on('open', () => {
            setupConnection(conn);
            resolve(conn);
          });
          conn.on('error', err => reject(err));
          setTimeout(() => reject(new Error('timeout')), 8000);
        });
      }

      async function handleIncomingMessage(msg, fromPeerId) {
        const convId = getConversationId(myDeviceId, fromPeerId);
        let displayText = '';
        try {
          if(msg.type === 'text') {
            displayText = await decryptData(msg.encryptedData, fromPeerId);
          } else if(msg.type === 'file') {
            const decBuf = await decryptFileBuffer(base64ToArrayBuffer(msg.encryptedData), fromPeerId);
            const blob = new Blob([decBuf]);
            const fileId = 'file_'+Date.now()+'_'+Math.random().toString(36);
            await dbStoreFile(fileId, blob);
            displayText = `📎 ${msg.fileName} (${formatSize(msg.fileSize)})`;
            msg.fileBlobId = fileId;
          }
        } catch(e) { displayText = '🔒 Ошибка расшифровки'; }
        const dbMsg = {
          id: msg.id || 'msg_'+Date.now()+'_'+Math.random().toString(36),
          conversationId: convId,
          from: msg.from,
          to: msg.to,
          timestamp: msg.timestamp || Date.now(),
          type: msg.type,
          encryptedData: msg.encryptedData,
          fileName: msg.fileName,
          fileSize: msg.fileSize,
          fileBlobId: msg.fileBlobId,
          status: 'delivered'
        };
        await dbAddMessage(dbMsg);
        if(!messageCache[convId]) messageCache[convId] = [];
        messageCache[convId].push(dbMsg);
        if(currentChatPeerId === fromPeerId) renderChatMessages();
        updateUnread();
        renderContactsList();
      }

      async function sendMessage() {
        const text = inputMessage.value.trim();
        const file = fileInput.files[0];
        if(!text && !file) return;
        if(!currentChatPeerId) return;
        const peerId = currentChatPeerId;
        try {
          let msg = {
            id: 'msg_'+Date.now()+'_'+Math.random().toString(36),
            from: myDeviceId,
            to: peerId,
            timestamp: Date.now(),
            type: 'text',
            encryptedData: '',
            fileName: '',
            fileSize: 0,
            status: 'pending'
          };
          if(file) {
            const buf = await file.arrayBuffer();
            const encBuf = await encryptFileBuffer(buf, peerId);
            msg.type = 'file';
            msg.encryptedData = arrayBufferToBase64(encBuf);
            msg.fileName = file.name;
            msg.fileSize = file.size;
            fileInput.value = '';
          } else if(text) {
            const enc = await encryptData(text, peerId);
            msg.encryptedData = enc;
            inputMessage.value = '';
          }
          const convId = getConversationId(myDeviceId, peerId);
          await dbAddMessage(msg);
          if(!messageCache[convId]) messageCache[convId] = [];
          messageCache[convId].push(msg);
          if(currentChatPeerId === peerId) renderChatMessages();

          let conn = activeConnections[peerId];
          if(!conn) {
            try { conn = await connectToPeer(peerId); } catch(e) {
              showToast('Пользователь офлайн. Сообщение будет отправлено позже.');
              if(!pendingMessages[peerId]) pendingMessages[peerId] = [];
              pendingMessages[peerId].push(msg);
              return;
            }
          }
          conn.send(JSON.stringify(msg));
          msg.status = 'sent';
          await dbAddMessage(msg);
          renderContactsList();
        } catch(e) { showToast('Ошибка отправки'); console.error(e); }
      }

      async function sendPendingMessages(peerId) {
        if(!pendingMessages[peerId]) return;
        const msgs = [...pendingMessages[peerId]];
        pendingMessages[peerId] = [];
        for(const msg of msgs) {
          const conn = activeConnections[peerId];
          if(conn) {
            conn.send(JSON.stringify(msg));
            msg.status = 'sent';
            await dbAddMessage(msg);
          }
        }
      }

      function updateUnread() {
        // simple visual badge not implemented fully, but contacts list shows last message
      }

      function renderContactsList() {
        const users = Object.entries(knownPeers).filter(([id])=>id!==myDeviceId);
        let html = '';
        if(users.length===0) html = '<div class="empty-state"><p>Контактов пока нет</p><p style="font-size:var(--font-xs);">Нажмите ＋ чтобы добавить друга по ID</p></div>';
        else {
          html = users.map(([id,u])=>{
            const convId = getConversationId(myDeviceId, id);
            const lastMsg = (messageCache[convId]?.slice(-1)[0]);
            const preview = lastMsg ? (lastMsg.type==='file'?`📎 ${lastMsg.fileName}`:'Сообщение') : '';
            return `<div class="list-item" data-peer-id="${id}" data-peer-name="${u.displayName||'Unknown'}">
              <div class="avatar" style="background:${avatarColor(id)};">${avatarInitials(u.displayName||'?')}<div class="online-dot${u.online?'':' offline'}"></div></div>
              <div class="list-info"><span class="list-name">${escapeHTML(u.displayName||'Unknown')}</span><span class="list-preview">${escapeHTML(preview)}</span></div>
            </div>`;
          }).join('');
        }
        contactsList.innerHTML = html;
        document.querySelectorAll('.list-item').forEach(el=>{
          el.addEventListener('click', ()=>{
            const pid = el.dataset.peerId;
            const pname = el.dataset.peerName;
            openChat(pid, pname);
          });
        });
        adaptLayout();
      }

      async function openChat(peerId, peerName) {
        currentChatPeerId = peerId;
        currentChatPeerName = peerName;
        chatTitle.textContent = peerName || 'Чат';
        const p = knownPeers[peerId];
        chatStatus.textContent = p?.online ? '● онлайн' : '';
        const convId = getConversationId(myDeviceId, peerId);
        if(!messageCache[convId]) {
          messageCache[convId] = await dbGetMessages(convId);
        }
        renderChatMessages();
        navigateTo(screenChat);
        if(p?.online && !activeConnections[peerId]) {
          connectToPeer(peerId).catch(()=>{});
        }
        setTimeout(()=>{ chatMessages.scrollTop = chatMessages.scrollHeight; }, 300);
      }

      async function renderChatMessages() {
        if(!currentChatPeerId) return;
        const convId = getConversationId(myDeviceId, currentChatPeerId);
        const msgs = messageCache[convId] || [];
        if(msgs.length===0) {
          chatMessages.innerHTML = '<div class="empty-state"><p>Нет сообщений</p></div>';
        } else {
          const frags = [];
          for(const m of msgs) {
            const isSent = m.from === myDeviceId;
            let content = '';
            if(m.type==='file') {
              content = `<div class="file-bubble" data-file-id="${m.fileBlobId||''}" data-enc="${m.encryptedData}"><span class="file-icon">📄</span><span>${escapeHTML(m.fileName)} (${formatSize(m.fileSize)})</span></div>`;
            } else {
              try {
                if(m.from === myDeviceId) {
                  const dec = await decryptData(m.encryptedData, m.to).catch(()=>'🔒');
                  content = escapeHTML(dec);
                } else {
                  const dec = await decryptData(m.encryptedData, m.from).catch(()=>'🔒');
                  content = escapeHTML(dec);
                }
              } catch(e) { content = '🔒'; }
            }
            frags.push(`<div class="msg-row ${isSent?'sent':'received'}"><div class="bubble">${content}<div class="msg-time">${formatTime(m.timestamp)}</div></div></div>`);
          }
          chatMessages.innerHTML = frags.join('');
          document.querySelectorAll('.file-bubble[data-file-id]').forEach(el=>{
            el.addEventListener('click', async ()=>{
              const fileId = el.dataset.fileId;
              if(fileId) {
                const blob = await dbGetFile(fileId);
                if(blob) downloadBlob(blob, el.querySelector('span:last-child')?.textContent||'file');
              }
            });
          });
        }
        requestAnimationFrame(()=>{ chatMessages.scrollTop = chatMessages.scrollHeight; adaptLayout(); });
      }

      function downloadBlob(blob, name) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
      }
      function formatSize(b) { if(!b) return '0 B'; if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toFixed(1)+' KB'; return (b/1048576).toFixed(1)+' MB'; }

      document.getElementById('setup-form').addEventListener('submit', async e => {
        e.preventDefault();
        const name = inputDisplayname.value.trim();
        if(name.length<2) return showToast('Имя короткое');
        myDisplayName = name;
        localStorage.setItem('securechat_displayname', name);
        await loadOrCreateKeys();
        initGun();
        initPeer();
        updateMyGunProfile();
        navigateTo(screenList);
        showToast('Добро пожаловать, '+name);
        adaptLayout();
      });

      document.getElementById('btn-back').addEventListener('click', ()=>{
        currentChatPeerId = null;
        navigateTo(screenList);
      });
      document.getElementById('btn-add-friend').addEventListener('click', ()=>{
        const id = prompt('Введите Peer ID друга:');
        if(id && id.trim()) {
          knownPeers[id] = knownPeers[id] || { displayName: 'Друг', publicJWK: null, peerId: id, online: false };
          renderContactsList();
          showToast('Добавлен. Обмен ключами произойдёт при подключении.');
        }
      });
      document.getElementById('btn-send').addEventListener('click', sendMessage);
      inputMessage.addEventListener('keydown', e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} });
      document.getElementById('btn-attach').addEventListener('click', ()=>fileInput.click());
      fileInput.addEventListener('change', ()=>{ if(fileInput.files[0]) sendMessage(); });

      window.addEventListener('resize', adaptLayout);
      if(window.visualViewport) {
        window.visualViewport.addEventListener('resize', adaptLayout);
        window.visualViewport.addEventListener('scroll', adaptLayout);
      }
      (async ()=>{
        try {
          db = await openDB();
          await loadOrCreateKeys();
          if(myDisplayName) {
            initGun();
            initPeer();
            updateMyGunProfile();
            navigateTo(screenList);
            adaptLayout();
          } else {
            navigateTo(screenSetup);
            adaptLayout();
          }
        } catch(e) {
          showToast('Ошибка инициализации');
          console.error(e);
        }
      })();
    })();
  </script>
</body>
</html>
